openapi: 3.0.3
info:
  title: 청춘교환 서버 1 API
  version: 1.1.0
  description: |
    ## 처음 호출하는 순서

    1. **01 참여자 시작**에서 내 이름을 등록합니다. 브라우저에 참여자 쿠키가 발급됩니다.
    2. **03 책과 초대 링크 만들기**에서 상대 호칭을 입력합니다. 응답의 bookId와 invitation.code를 확인하세요.
    3. 다른 브라우저 프로필에서 **06 초대 미리보기**로 실제 code를 확인하고 **07 초대 수락**을 호출합니다.
    4. 두 브라우저에서 **04 책장 조회**를 호출하면 같은 책이 ACTIVE로 표시됩니다.
    5. Swagger 상단 문서 선택을 **챕터와 이야기**로 바꿔 챕터 작성 API를 사용하세요.

    ## 두 사람으로 테스트하기

    - 같은 브라우저 프로필의 탭들은 참여자 쿠키를 공유합니다. 일반 창과 시크릿 창 또는 다른 프로필을 사용하세요.
    - Authorize에 쿠키를 직접 입력하는 대신 참여자 시작 또는 초대 수락으로 쿠키를 발급받습니다.
    - HTTP localhost에서는 IntelliJ의 **Local** 실행 구성을 사용합니다.
    - 예시의 ID와 초대 코드는 실제 생성 응답에서 받은 값으로 바꿔 주세요.
    - inviteUrl은 프론트 초대 화면 주소입니다. Swagger에서는 invitation.code로 미리보기·수락 API를 호출합니다.

    ## 응답 읽는 방법

    | 필드 | 의미 |
    | --- | --- |
    | success | 처리 성공 여부 |
    | data | 성공 결과. 실패하면 null |
    | error | 실패 코드와 안내 문구. 성공하면 null |

    책 상태는 INVITE_PENDING이면 초대 대기, ACTIVE이면 두 사람 연결 완료입니다.
    mySlotNo는 책 안에서 내 자리 번호이고, counterpartLabel은 내가 상대를 부르는 호칭입니다.
    비참여자의 책 조회는 404이며, 세션이 없거나 만료되면 401입니다.
tags:
  - name: 참여자
    description: 현재 브라우저에서 사용할 참여자를 시작하고 확인합니다.
  - name: 책장과 초대
    description: 관계별 책을 만들고 초대 링크로 두 사람을 연결합니다.
servers:
  - url: /
paths:
  /api/v1/participants:
    post:
      summary: 01 참여자 시작 또는 기존 기기 재접속
      tags: [참여자]
      description: |
        처음 사용하는 브라우저에서 호출합니다. displayName은 필수이며 birthYear는 선택입니다.

        - 새 참여자와 세션을 만들면 201입니다.
        - 이미 유효한 쿠키가 있으면 기존 참여자를 200으로 반환합니다. 이름을 수정하는 API는 아닙니다.
        - 이후 요청에서는 브라우저가 쿠키를 자동 전송합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
            example: {displayName: 지우, birthYear: 2003}
      responses:
        '201':
          description: 참여자 및 기기 세션 생성
          headers:
            Set-Cookie:
              schema: {type: string}
              description: 이후 요청에 브라우저가 보내는 HttpOnly 세션 쿠키
          content:
            application/json:
              example: {success: true, data: {participantId: 1, displayName: 지우, birthYear: 2003}, error: null}
        '200':
          description: 이미 식별된 참여자 반환
          content:
            application/json:
              example: {success: true, data: {participantId: 1, displayName: 지우, birthYear: 2003}, error: null}
        '400': {$ref: '#/components/responses/BadInput'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/participants/me:
    get:
      summary: 02 현재 기기의 참여자 확인
      tags: [참여자]
      description: 내 브라우저가 누구로 연결돼 있는지 확인할 때 호출합니다. 세션이 없거나 만료됐으면 401입니다.
      security: [{participantCookie: []}]
      responses:
        '200':
          description: 내 프로필
          content:
            application/json:
              example: {success: true, data: {participantId: 1, displayName: 지우, birthYear: 2003}, error: null}
        '401': {$ref: '#/components/responses/SessionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/books:
    post:
      summary: 03 책과 초대 링크 만들기
      tags: [책장과 초대]
      description: |
        책장의 새 책 만들기에서 호출합니다. 먼저 참여자 시작을 완료하세요.

        - counterpartLabel에 내가 상대를 부를 호칭을 입력합니다. 예를 들면 엄마입니다.
        - title을 생략하면 ‘청춘 교환일기’로 생성됩니다.
        - 책과 내 참여 관계, 24시간 동안 유효한 초대 링크가 생성됩니다.
        - 기본 ‘초등학생 시절’ 챕터가 함께 생성됩니다.
        - 반환된 invitation.code는 상대 브라우저의 초대 수락 요청에 사용합니다.
      security: [{participantCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counterpartLabel]
              properties:
                title: {type: string, maxLength: 100, default: 청춘 교환일기}
                counterpartLabel: {type: string, maxLength: 30}
            example: {counterpartLabel: 엄마}
      responses:
        '201':
          description: 초대 대기 책과 발급한 링크. 응답 값을 복사하여 다른 브라우저에서 수락한다.
          content:
            application/json:
              example:
                success: true
                data:
                  book: {bookId: 1, title: 청춘 교환일기, status: INVITE_PENDING, mySlotNo: 1, counterpartLabel: 엄마, counterpartName: null}
                  invitation: {code: d3JsR9aQ5tY8zK0uE4mB6nV2xL1sP7Gh, inviteUrl: 'http://localhost:8080/invite/d3JsR9aQ5tY8zK0uE4mB6nV2xL1sP7Gh', expiresAt: '2026-11-22T00:00:00Z'}
                error: null
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/SessionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      summary: 04 내 책장 조회
      tags: [책장과 초대]
      description: 홈의 책장에 표시할 책 목록입니다. 내 참여 책만 최신 ID 순으로 반환합니다. 참여한 책이 없으면 빈 배열입니다. 수락 전에는 상대 이름이 null일 수 있습니다.
      security: [{participantCookie: []}]
      responses:
        '200':
          description: 내 참여 책만 조회
          content:
            application/json:
              example:
                success: true
                data:
                  - {bookId: 1, title: 청춘 교환일기, status: ACTIVE, mySlotNo: 1, counterpartLabel: 엄마, counterpartName: 은주}
                error: null
        '401': {$ref: '#/components/responses/SessionRequired'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/books/{bookId}:
    parameters:
      - in: path
        name: bookId
        required: true
        schema: {type: integer, format: int64, minimum: 1}
        example: 1
    get:
      summary: 05 책 연결 상태와 상대 확인
      tags: [책장과 초대]
      description: 초대 수락 후 또는 책을 열 때 연결 상태와 상대 정보를 확인합니다. 내 책이 아니면 없는 책과 동일한 404 응답을 반환합니다.
      security: [{participantCookie: []}]
      responses:
        '200':
          description: 책의 연결 상태와 상대 정보
          content:
            application/json:
              example: {success: true, data: {bookId: 1, title: 청춘 교환일기, status: ACTIVE, mySlotNo: 1, counterpartLabel: 엄마, counterpartName: 은주}, error: null}
        '400': {$ref: '#/components/responses/BadInput'}
        '401': {$ref: '#/components/responses/SessionRequired'}
        '404':
          description: 없는 책 또는 내 책이 아님
          content:
            application/json:
              example: {success: false, data: null, error: {code: BOOK_NOT_FOUND, message: 책을 찾을 수 없어요.}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/invitations/{code}:
    parameters:
      - $ref: '#/components/parameters/InviteCode'
    get:
      summary: 06 초대 링크 미리보기
      tags: [책장과 초대]
      description: |
        링크를 받은 사람이 수락 전 초대한 사람과 책 제목을 확인할 때 호출합니다. 세션 없이도 조회할 수 있습니다.

        - AVAILABLE은 수락 가능한 초대입니다.
        - 이미 연결된 참여자가 사용한 링크를 다시 열면 LINKED와 bookId를 반환합니다.
        - 사용된 링크를 제3자가 열거나 만료·취소된 링크를 열면 409입니다.
      responses:
        '200':
          description: 수락 전 화면에 표시할 정보 또는 이미 참여 중인 책
          content:
            application/json:
              examples:
                available:
                  value: {success: true, data: {status: AVAILABLE, inviterName: 지우, bookTitle: 청춘 교환일기, expiresAt: '2026-11-22T00:00:00Z', bookId: null}, error: null}
                linked:
                  value: {success: true, data: {status: LINKED, inviterName: 지우, bookTitle: 청춘 교환일기, expiresAt: '2026-11-22T00:00:00Z', bookId: 1}, error: null}
        '404': {$ref: '#/components/responses/InviteNotFound'}
        '409': {$ref: '#/components/responses/InviteConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/invitations/{code}/accept:
    parameters:
      - $ref: '#/components/parameters/InviteCode'
    post:
      summary: 07 초대 수락하고 가족 연결
      tags: [책장과 초대]
      description: |
        초대받은 사람의 브라우저에서 호출합니다. 먼저 초대 미리보기로 상태를 확인하세요.

        - 새 기기는 displayName을 입력합니다. 수락과 함께 참여자 쿠키가 발급됩니다.
        - 유효한 세션이 있으면 기존 참여자를 연결합니다.
        - counterpartLabel은 수락자가 상대를 부르는 말입니다. 생략하면 ‘가족’입니다.
        - 최초 연결은 201, 이미 수락한 기기의 재요청은 200입니다.
        - 본인의 초대 수락, 만료·취소·다른 사람이 사용한 링크는 409입니다.
        - 연결 후 두 참여자가 같은 책을 조회하면 ACTIVE가 표시됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: {type: string, maxLength: 50}
                birthYear: {type: integer, minimum: 1900}
                counterpartLabel: {type: string, maxLength: 30, default: 가족}
            example: {displayName: 은주, birthYear: 1976, counterpartLabel: 지우}
      responses:
        '201':
          description: 두 번째 참여자 연결. 새 기기에는 기기 쿠키도 발급한다.
          content:
            application/json:
              example: {success: true, data: {bookId: 1, title: 청춘 교환일기, status: ACTIVE, mySlotNo: 2, counterpartLabel: 지우, counterpartName: 지우}, error: null}
        '200':
          description: 이미 수락한 같은 기기의 재요청
          content:
            application/json:
              example: {success: true, data: {bookId: 1, title: 청춘 교환일기, status: ACTIVE, mySlotNo: 2, counterpartLabel: 지우, counterpartName: 지우}, error: null}
        '400': {$ref: '#/components/responses/BadInput'}
        '404': {$ref: '#/components/responses/InviteNotFound'}
        '409': {$ref: '#/components/responses/InviteConflict'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    participantCookie:
      type: apiKey
      in: cookie
      name: participant_session
  parameters:
    InviteCode:
      in: path
      name: code
      required: true
      description: 예시 대신 책 생성 응답으로 받은 실제 code를 사용한다.
      schema: {type: string, minLength: 32, maxLength: 32}
      example: d3JsR9aQ5tY8zK0uE4mB6nV2xL1sP7Gh
  schemas:
    ProfileInput:
      type: object
      required: [displayName]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 50}
        birthYear: {type: integer, minimum: 1900, description: 현재 연도 이하의 정수}
  responses:
    BadInput:
      description: 필수 값 누락 또는 입력 형식 오류
      content:
        application/json:
          example: {success: false, data: null, error: {code: INVALID_REQUEST, message: 닉네임 값을 입력해 주세요.}}
    SessionRequired:
      description: 유효한 기기 세션이 없음
      content:
        application/json:
          example: {success: false, data: null, error: {code: SESSION_REQUIRED, message: 먼저 닉네임을 입력해 주세요.}}
    InviteNotFound:
      description: 없는 초대 코드
      content:
        application/json:
          example: {success: false, data: null, error: {code: INVITATION_NOT_FOUND, message: 초대 링크를 찾을 수 없어요.}}
    InviteConflict:
      description: 사용·만료·취소된 초대 또는 본인 초대 수락
      content:
        application/json:
          examples:
            used:
              value: {success: false, data: null, error: {code: INVITATION_USED, message: 이미 다른 기기가 이 초대를 수락했어요.}}
            expired:
              value: {success: false, data: null, error: {code: INVITATION_EXPIRED, message: 초대 링크가 만료됐어요.}}
            selfAccept:
              value: {success: false, data: null, error: {code: SELF_INVITATION, message: 내가 만든 초대는 수락할 수 없어요.}}
            revoked:
              value: {success: false, data: null, error: {code: INVITATION_REVOKED, message: 사용할 수 없는 초대 링크예요.}}
    InternalError:
      description: 예상하지 못한 서버 오류
      content:
        application/json:
          example: {success: false, data: null, error: {code: INTERNAL_ERROR, message: 요청을 처리하지 못했어요.}}
